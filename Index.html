<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>My Git Viewer</title>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #eee; padding: 20px; }
        #file-list { list-style: none; padding: 0; }
        .file-item { background: #333; margin: 5px 0; padding: 10px; border-radius: 5px; cursor: pointer; }
        .file-item:hover { background: #444; }
        video { width: 100%; max-width: 800px; display: none; margin-top: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Просмотр файлов: My-git</h1>
        <ul id="file-list">Загрузка файлов...</ul>

        <h2 id="video-title"></h2>
        <video id="my-video" class="video-js vjs-default-skin" controls preload="auto">
            <source id="video-source" src="" type="video/mp4">
        </video>
    </div>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script>
        const user = 'Romanfoks';
        const repo = 'My-git';
        const player = videojs('my-video');

        async function getFiles() {
            const response = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/`);
            const files = await response.json();
            const listElement = document.getElementById('file-list');
            listElement.innerHTML = '';

            files.forEach(file => {
                if (file.type === 'file') {
                    const li = document.createElement('li');
                    li.className = 'file-item';
                    li.innerText = file.name;
                    li.onclick = () => openFile(file);
                    listElement.appendChild(li);
                }
            });
        }

        function openFile(file) {
            const videoElement = document.querySelector('video');
            const videoTitle = document.getElementById('video-title');
            
            // Если это видео (mkv, mp4, webm)
            if (file.name.match(/\.(mkv|mp4|webm)$/i)) {
                videoElement.style.display = 'block';
                videoTitle.innerText = 'Играет: ' + file.name;
                
                // Используем raw ссылку для воспроизведения
                const rawUrl = `https://raw.githubusercontent.com/${user}/${repo}/main/${file.path}`;
                player.src({ type: 'video/mp4', src: rawUrl });
                player.play();
            } else {
                window.open(file.html_url, '_blank'); // Открываем код/текст в новой вкладке
            }
        }

        getFiles();
    </script>
</body>
</html>
