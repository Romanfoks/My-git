<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My-git YouTube View</title>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link href="https://unpkg.com/@videojs/themes@1.0.1/dist/youtube/index.css" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', Arial, sans-serif; background: #0f0f0f; color: #f1f1f1; padding: 20px; margin: 0; }
        .container { max-width: 900px; margin: 0 auto; }

        h1 { font-size: 20px; font-weight: 500; margin-bottom: 20px; padding-left: 10px; }

        /* File List Design */
        .file-list { background: transparent; padding: 0; margin-top: 10px; }
        .file-item {
            list-style: none; padding: 12px 15px; border-radius: 8px;
            cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s;
        }
        .file-item:hover { background: #272727; }
        .file-name { display: flex; align-items: center; gap: 15px; font-size: 15px; }
        .file-info { font-size: 13px; color: #aaa; }

        /* Video Container */
        .video-section { display: none; margin-bottom: 40px; }
        .video-js {
            width: 100% !important; height: auto !important; aspect-ratio: 16/9;
            border-radius: 12px; overflow: hidden; background-color: #000;
        }

        /* Фикс темы YouTube */
        .vjs-youtube.video-js .vjs-play-progress,
        .video-js .vjs-play-progress:before { background-color: #ff0000 !important; }
        .video-js .vjs-volume-level { background-color: #fff !important; }

        .video-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; }
        .video-title { font-size: 18px; margin: 0; font-weight: 500; }
        .close-btn { background: none; border: none; color: #aaa; font-size: 24px; cursor: pointer; }
        .close-btn:hover { color: #fff; }

        .btn-dl {
            display: inline-block; margin-top: 10px; padding: 8px 16px;
            background: #272727; color: #fff; text-decoration: none;
            border-radius: 18px; font-size: 14px; font-weight: 500;
        }
        .btn-dl:hover { background: #3f3f3f; }
    </style>
</head>
<body>

<div class="container">
    <div id="player-ui" class="video-section">
        <div class="video-header">
            <h3 id="current-title" class="video-title"></h3>
            <button class="close-btn" onclick="closePlayer()">✕</button>
        </div>

        <video id="my-video" class="video-js vjs-theme-youtube vjs-big-play-centered" controls preload="auto">
        </video>

        <a id="download-link" class="btn-dl" href="#" target="_blank">Download</a>
    </div>

    <h1>Files</h1>
    <ul id="file-list" class="file-list">Loading...</ul>
</div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script>
    const user = 'Romanfoks';
    const repo = 'My-git';
    let player;

    document.addEventListener('DOMContentLoaded', () => {
        player = videojs('my-video', {
            fluid: true,
            playbackRates: [0.5, 1, 1.25, 1.5, 2],
            controlBar: {
                skipButtons: { forward: 10, backward: 10 },
                volumePanel: { inline: true } // Горизонтальный звук
            }
        });
        loadFiles();
    });

    async function loadFiles() {
        const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/`);
        const data = await res.json();
        const list = document.getElementById('file-list');
        list.innerHTML = '';

        data.forEach(file => {
            // Игнорим .idea, index.html и системные конфиги
            if (['index.html', '.gitattributes', '.idea', 'CNAME'].includes(file.name)) return;

            const isVideo = file.name.match(/\.(mkv|mp4|webm)$/i);
            const li = document.createElement('li');
            li.className = 'file-item';
            li.innerHTML = `
                <div class="file-name">
                    <span>${isVideo ? '▶️' : '📄'}</span>
                    <span>${file.name}</span>
                </div>
                <span class="file-info">${(file.size / 1048576).toFixed(1)} MB</span>
            `;

            li.onclick = () => isVideo ? playVideo(file) : window.open(file.html_url, '_blank');
            list.appendChild(li);
        });
    }

    function playVideo(file) {
        const ui = document.getElementById('player-ui');
        const rawUrl = `https://raw.githubusercontent.com/${user}/${repo}/main/${encodeURIComponent(file.path)}`;

        ui.style.display = 'block';
        document.getElementById('current-title').innerText = file.name;
        document.getElementById('download-link').href = rawUrl;

        player.src({ type: 'video/mp4', src: rawUrl });
        player.play();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closePlayer() {
        player.pause();
        player.src('');
        document.getElementById('player-ui').style.display = 'none';
    }
</script>

</body>
</html>
