<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romanfoks Private Cinema</title>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link href="https://unpkg.com/@videojs/themes@1.0.1/dist/youtube/index.css" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background: #0f0f0f; color: #f1f1f1; padding: 20px; margin: 0; }
        .container { max-width: 1000px; margin: 0 auto; }

        /* Твой ник вместо старого заголовка */
        h1 { font-size: 24px; font-weight: 500; border-bottom: 1px solid #3f3f3f; padding-bottom: 15px; margin-bottom: 20px; color: #fff; }

        .path-bar {
            font-size: 13px;
            color: #aaa;
            margin: 8px 0 16px;
        }
        .crumb {
            cursor: pointer;
            color: #4ea3ff;
        }
        .crumb:hover {
            text-decoration: underline;
        }
        .file-list { background: transparent; padding: 0; margin: 0; }
        .file-item {
            list-style: none; padding: 12px 15px; border-radius: 8px;
            cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.1s;
        }
        .file-item:hover { background: #272727; }
        .file-name { display: flex; align-items: center; gap: 12px; font-size: 15px; }
        .file-info { font-size: 12px; color: #aaa; }

        .video-section { display: none; margin-bottom: 40px; position: relative; }
        .video-js { width: 100% !important; height: auto !important; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 30px rgba(0,0,0,0.8); }

        /* YouTube UI */
        .video-js .vjs-play-progress { background: #ff0000 !important; }
        .video-js .vjs-slider { background: rgba(255,255,255,0.2); }
        .video-js .vjs-volume-level { background: #fff !important; }
        .video-js .vjs-volume-panel { display: flex !important; align-items: center; }
        .video-js .vjs-volume-control.vjs-volume-horizontal { width: 5em !important; height: 3em !important; display: flex !important; align-items: center; }

        .video-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; }
        .video-title { font-size: 18px; margin: 0; font-weight: 500; }
        .close-btn { background: none; border: none; color: #aaa; font-size: 30px; cursor: pointer; transition: 0.2s; }
        .close-btn:hover { color: #fff; transform: scale(1.1); }

        .actions-bar { display: flex; gap: 10px; margin-top: 15px; }
        .btn-yt { display: inline-block; padding: 10px 24px; background: #272727; color: white; text-decoration: none; border-radius: 20px; font-size: 14px; font-weight: 500; border: none; cursor: pointer; transition: 0.2s; }
        .btn-yt:hover { background: #3f3f3f; }

        .file-viewer {
            display: none;
            margin-top: 24px;
            padding: 16px;
            border-radius: 12px;
            background: #111;
            border: 1px solid #333;
        }
        .file-viewer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .file-viewer-title {
            margin: 0;
            font-size: 16px;
        }
        .file-viewer-content {
            max-height: 400px;
            overflow: auto;
            background: #050505;
            border-radius: 8px;
            padding: 12px;
            font-family: Consolas, Menlo, monospace;
            font-size: 13px;
            white-space: pre;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="player-ui" class="video-section">
        <div class="video-header">
            <h3 id="current-title" class="video-title"></h3>
            <button class="close-btn" onclick="closePlayer()">✕</button>
        </div>
        <video id="my-video" class="video-js vjs-theme-youtube vjs-big-play-centered" controls preload="auto"></video>

        <div class="actions-bar">
            <a id="download-link" class="btn-yt" href="#" target="_blank">Download</a>
            <button id="copy-btn" class="btn-yt" onclick="copyVideoLink()">🔗 Copy Link</button>
        </div>
    </div>

    <h1>Romanfoks</h1>

    <div id="path-bar" class="path-bar"></div>
    <ul id="file-list" class="file-list">Loading files...</ul>

    <div id="file-viewer" class="file-viewer">
        <div class="file-viewer-header">
            <h3 id="file-viewer-title" class="file-viewer-title"></h3>
            <button class="close-btn" onclick="closeFileViewer()">✕</button>
        </div>
        <pre id="file-viewer-content" class="file-viewer-content"></pre>
    </div>
</div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script>
    const user = 'Romanfoks';
    const repo = 'My-git';
    let player;
    let currentVideoName = "";
    let currentPath = "";

    document.addEventListener('DOMContentLoaded', () => {
        player = videojs('my-video', {
            fluid: true,
            playbackRates: [0.5, 1, 1.25, 1.5, 2],
            userActions: { hotkeys: true },
            controlBar: { volumePanel: { inline: true } }
        });
        loadFiles("");
    });

    function renderPathBar() {
        const bar = document.getElementById('path-bar');
        const parts = currentPath ? currentPath.split('/') : [];
        const crumbs = [];

        // Корень
        crumbs.push(`<span class="crumb" onclick="loadFiles('')">/</span>`);

        let acc = "";
        parts.forEach((p, idx) => {
            acc = acc ? acc + "/" + p : p;
            crumbs.push(
                `<span> / </span><span class="crumb" onclick="loadFiles('${acc.replace(/'/g, "\\'")}')">${p}</span>`
            );
        });

        bar.innerHTML = crumbs.join("");
    }

    async function loadFiles(path) {
        try {
            currentPath = path || "";
            renderPathBar();

            const apiPath = currentPath ? `/${encodeURIComponent(currentPath).replace(/%2F/g, '/')}` : "/";
            const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents${apiPath}`);
            const data = await res.json();
            const list = document.getElementById('file-list');
            list.innerHTML = '';

            const items = Array.isArray(data) ? data : [];

            // Сначала папки, потом файлы
            items
                .sort((a, b) => {
                    if (a.type === b.type) return a.name.localeCompare(b.name);
                    return a.type === 'dir' ? -1 : 1;
                })
                .forEach(file => {
                    // В корне скрываем служебные файлы, но в подпапках показываем всё
                    if (!currentPath) {
                        const forbiddenRoot = ['index.html', '.gitattributes', '.idea', 'CNAME', 'Upload.py', 'upload.py'];
                        if (forbiddenRoot.includes(file.name)) return;
                    }

                    const isDir = file.type === 'dir';
                    const isVideo = !isDir && file.name.match(/\.(mkv|mp4|webm)$/i);
                const li = document.createElement('li');
                li.className = 'file-item';
                li.innerHTML = `
                    <div class="file-name">
                        <span>${isDir ? '📁' : (isVideo ? '▶️' : '📄')}</span>
                        <span>${file.name}</span>
                    </div>
                    <span class="file-info">
                        ${isDir ? 'folder' : ((file.size / 1048576).toFixed(1) + ' MB')}
                    </span>
                `;

                li.onclick = () => {
                    if (isDir) {
                        loadFiles(file.path);
                    } else if (isVideo) {
                        playVideo(file);
                        window.location.hash = encodeURIComponent(file.name);
                    } else {
                        openFile(file);
                    }
                };
                list.appendChild(li);
            });

            const currentHash = window.location.hash.substring(1);
            if (currentHash) {
                const fileName = decodeURIComponent(currentHash);
                const videoFile = items.find(f => f.name === fileName);
                if (videoFile) playVideo(videoFile);
            }
        } catch (e) { console.error("Error loading files"); }
    }

    function playVideo(file) {
        currentVideoName = file.name;
        const ui = document.getElementById('player-ui');
        const rawUrl = `https://raw.githubusercontent.com/${user}/${repo}/main/${encodeURIComponent(file.path).replace(/%2F/g, '/')}`;

        ui.style.display = 'block';
        document.getElementById('current-title').innerText = file.name;
        document.getElementById('download-link').href = rawUrl;

        player.src({ type: 'video/mp4', src: rawUrl });
        player.ready(() => { player.play(); });
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function copyVideoLink() {
        const fullLink = window.location.origin + window.location.pathname + "#" + encodeURIComponent(currentVideoName);
        navigator.clipboard.writeText(fullLink).then(() => {
            const btn = document.getElementById('copy-btn');
            const oldText = btn.innerHTML;
            btn.innerHTML = "✅ Copied!";
            setTimeout(() => { btn.innerHTML = oldText; }, 2000);
        });
    }

    function closePlayer() {
        player.pause();
        player.src('');
        document.getElementById('player-ui').style.display = 'none';
        window.location.hash = '';
    }

    async function openFile(file) {
        closePlayer();
        const viewer = document.getElementById('file-viewer');
        const title = document.getElementById('file-viewer-title');
        const content = document.getElementById('file-viewer-content');

        title.innerText = file.path || file.name;
        content.textContent = 'Loading...';
        viewer.style.display = 'block';

        const rawUrl = `https://raw.githubusercontent.com/${user}/${repo}/main/${encodeURIComponent(file.path).replace(/%2F/g, '/')}`;

        try {
            const res = await fetch(rawUrl);
            if (!res.ok) {
                content.textContent = `Нельзя показать содержимое (HTTP ${res.status}). Открою файл на GitHub.`;
                window.open(file.html_url, '_blank');
                return;
            }

            const text = await res.text();
            // Простая защита от очень больших файлов
            if (text.length > 200000) {
                content.textContent = 'Файл слишком большой для предпросмотра. Открою на GitHub.';
                window.open(file.html_url, '_blank');
                return;
            }

            content.textContent = text;
        } catch (e) {
            content.textContent = 'Ошибка загрузки файла. Открою на GitHub.';
            window.open(file.html_url, '_blank');
        }
    }

    function closeFileViewer() {
        const viewer = document.getElementById('file-viewer');
        viewer.style.display = 'none';
        document.getElementById('file-viewer-content').textContent = '';
    }
</script>

</body>
</html>
