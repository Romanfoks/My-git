<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My-git Viewer</title>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link href="https://unpkg.com/@videojs/themes@1.0.1/dist/city/index.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px; margin: 0; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { border-bottom: 1px solid #30363d; padding-bottom: 10px; color: #58a6ff; font-weight: 400; }

        /* Список файлов */
        .file-list { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 0; margin-bottom: 20px; overflow: hidden; }
        .file-item {
            list-style: none; padding: 12px 20px; border-bottom: 1px solid #30363d;
            cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.2s;
        }
        .file-item:last-child { border-bottom: none; }
        .file-item:hover { background: #1f242c; color: #58a6ff; }
        .file-info { font-size: 0.85em; color: #8b949e; }

        /* Секция плеера */
        .video-container {
            display: none; margin-top: 20px; background: #161b22; padding: 10px;
            border-radius: 12px; border: 1px solid #30363d; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Фикс полос: видео заполняет контейнер */
        .video-js { width: 100% !important; height: auto !important; aspect-ratio: 16/9; border-radius: 6px; }
        .video-js .vjs-tech { object-fit: contain; }

        .video-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 0 5px; }
        .video-title { margin: 0; font-size: 1em; color: #f0f6fc; }

        .controls-row { text-align: center; margin-top: 15px; display: flex; gap: 10px; justify-content: center; }
        .btn {
            display: inline-block; padding: 8px 16px; border-radius: 6px;
            text-decoration: none; font-size: 0.9em; font-weight: 600; cursor: pointer; border: none;
        }
        .btn-download { background: #238636; color: white; }
        .btn-download:hover { background: #2ea043; }
        .btn-stop { background: #da3633; color: white; }
        .btn-stop:hover { background: #f85149; }

        /* Плавная громкость */
        .video-js .vjs-volume-panel { display: flex !important; }
        .video-js .vjs-volume-control { width: 5em !important; opacity: 1 !important; visibility: visible !important; }
    </style>
</head>
<body>

<div class="container">
    <h1>📁 Repository Files</h1>
    <ul id="file-list" class="file-list">Loading files...</ul>

    <div id="player-section" class="video-container">
        <div class="video-header">
            <h3 id="current-title" class="video-title"></h3>
        </div>

        <video id="my-video" class="video-js vjs-theme-city vjs-big-play-centered" controls preload="auto">
            <source id="video-source" src="" type="video/mp4">
        </video>

        <div class="controls-row">
            <a id="download-link" class="btn btn-download" href="#" target="_blank">📥 Download / Open in Player</a>
            <button class="btn btn-stop" onclick="stopVideo()">⏹ Stop Video</button>
        </div>
    </div>
</div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script>
    const user = 'Romanfoks';
    const repo = 'My-git';
    let player;

    // Инициализируем плеер при загрузке
    document.addEventListener('DOMContentLoaded', () => {
        player = videojs('my-video', {
            fluid: true, // Адаптивность
            controlBar: {
                children: [
                    'playToggle',
                    'volumePanel',
                    'currentTimeDisplay',
                    'timeDivider',
                    'durationDisplay',
                    'progressControl',
                    'liveDisplay',
                    'remainingTimeDisplay',
                    'customControlSpacer',
                    'playbackRateMenuButton',
                    'chaptersButton',
                    'descriptionsButton',
                    'subsCapsButton',
                    'audioTrackButton',
                    'fullscreenToggle',
                ],
                volumePanel: { inline: true } // Горизонтальная громкость
            }
        });
        loadFiles();
    });

    async function loadFiles() {
        try {
            const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/`);
            const data = await res.json();
            const list = document.getElementById('file-list');
            list.innerHTML = '';

            data.forEach(file => {
                // Игнорируем системные файлы и папку .idea
                if (file.name === 'index.html' || file.name === '.gitattributes' || file.name === '.idea') return;

                const isVideo = file.name.match(/\.(mkv|mp4|webm)$/i);
                const icon = isVideo ? '🎬' : '📄';

                const li = document.createElement('li');
                li.className = 'file-item';
                li.innerHTML = `
                        <span>${icon} ${file.name}</span>
                        <span class="file-info">${(file.size / 1024 / 1024).toFixed(1)} MB</span>
                    `;

                li.onclick = () => {
                    if (isVideo) {
                        playVideo(file);
                    } else {
                        window.open(file.html_url, '_blank');
                    }
                };
                list.appendChild(li);
            });
        } catch (e) {
            document.getElementById('file-list').innerText = 'Error loading files.';
        }
    }

    function playVideo(file) {
        const section = document.getElementById('player-section');
        const rawUrl = `https://raw.githubusercontent.com/${user}/${repo}/main/${encodeURIComponent(file.path)}`;

        section.style.display = 'block';
        document.getElementById('current-title').innerText = "Playing: " + file.name;
        document.getElementById('download-link').href = rawUrl;

        // Загружаем видео в плеер
        player.src({ type: 'video/mp4', src: rawUrl });
        player.load();

        // Скроллим к плееру
        section.scrollIntoView({ behavior: 'smooth' });
        player.play();
    }

    function stopVideo() {
        player.pause();
        document.getElementById('player-section').style.display = 'none';
    }
</script>
</body>
</html>
