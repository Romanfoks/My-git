<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My-git | Video Host</title>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link href="https://unpkg.com/@videojs/themes@1.0.1/dist/city/index.css" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background: #0f0f0f; color: #f1f1f1; padding: 20px; margin: 0; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { font-size: 22px; font-weight: 500; border-bottom: 1px solid #3f3f3f; padding-bottom: 15px; display: flex; align-items: center; gap: 10px; }

        .file-list { background: #0f0f0f; border-radius: 12px; padding: 0; margin-top: 10px; }
        .file-item {
            list-style: none; padding: 12px 15px; border-radius: 8px;
            cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.1s;
        }
        .file-item:hover { background: #272727; }
        .file-name { display: flex; align-items: center; gap: 12px; font-size: 15px; }
        .file-info { font-size: 12px; color: #aaaaaa; }

        .video-section { display: none; margin-bottom: 30px; }
        .video-js {
            width: 100% !important; height: auto !important; aspect-ratio: 16/9;
            border-radius: 12px; overflow: hidden; box-shadow: 0 4px 30px rgba(0,0,0,0.8);
        }

        /* YouTube Colors */
        .video-js .vjs-play-progress { background: #ff0000 !important; }
        .video-js .vjs-volume-level { background: #fff !important; }
        .video-js .vjs-load-progress div { background: rgba(255,255,255,0.2) !important; }

        .video-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 5px; }
        .video-title { font-size: 18px; margin: 0; font-weight: 500; color: #fff; }
        .close-btn { background: none; border: none; color: #aaa; font-size: 28px; cursor: pointer; line-height: 1; }
        .close-btn:hover { color: #fff; }

        .dl-bar { margin-top: 10px; }
        .btn-dl { background: #3f3f3f; color: white; padding: 8px 20px; border-radius: 20px; text-decoration: none; font-size: 14px; transition: 0.2s; display: inline-block; }
        .btn-dl:hover { background: #505050; }
    </style>
</head>
<body>

<div class="container">
    <div id="player-ui" class="video-section">
        <div class="video-header">
            <h3 id="current-title" class="video-title"></h3>
            <button class="close-btn" onclick="closePlayer()">×</button>
        </div>

        <video id="my-video" class="video-js vjs-theme-city vjs-big-play-centered" controls preload="auto" disablePictureInPicture>
        </video>

        <div class="dl-bar">
            <a id="download-link" class="btn-dl" href="#" target="_blank">Download File</a>
        </div>
    </div>

    <h1><span>📁</span> Repository Content</h1>
    <ul id="file-list" class="file-list">Fetching files...</ul>
</div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script>
    const user = 'Romanfoks';
    const repo = 'My-git';
    let player;

    document.addEventListener('DOMContentLoaded', () => {
        player = videojs('my-video', {
            playbackRates: [0.5, 1, 1.25, 1.5, 2],
            responsive: true,
            fluid: true,
            controlBar: {
                volumePanel: { inline: true }
            }
        });
        loadFiles();
    });

    async function loadFiles() {
        const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/`);
        const data = await res.json();
        const list = document.getElementById('file-list');
        list.innerHTML = '';

        data.forEach(file => {
            // Игнорируем лишнее, включая .idea
            if (['index.html', '.gitattributes', '.idea', 'CNAME'].includes(file.name)) return;

            const isVideo = file.name.match(/\.(mkv|mp4|webm)$/i);
            const li = document.createElement('li');
            li.className = 'file-item';
            li.innerHTML = `
                <div class="file-name">
                    <span>${isVideo ? '▶️' : '📄'}</span>
                    <span>${file.name}</span>
                </div>
                <span class="file-info">${(file.size / 1048576).toFixed(1)} MB</span>
            `;

            li.onclick = () => isVideo ? playVideo(file) : window.open(file.html_url, '_blank');
            list.appendChild(li);
        });
    }

    function playVideo(file) {
        const ui = document.getElementById('player-ui');
        const rawUrl = `https://raw.githubusercontent.com/${user}/${repo}/main/${encodeURIComponent(file.path)}`;

        ui.style.display = 'block';
        document.getElementById('current-title').innerText = file.name;
        document.getElementById('download-link').href = rawUrl;

        player.src({ type: 'video/mp4', src: rawUrl });
        player.play();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closePlayer() {
        player.pause();
        player.src('');
        document.getElementById('player-ui').style.display = 'none';
    }
</script>

</body>
</html>
