<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My-git Viewer</title>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0d1117; color: #c9d1d9; padding: 20px; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; }

        h1 { border-bottom: 1px solid #30363d; padding-bottom: 10px; color: #58a6ff; }

        /* Список файлов */
        .file-list { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 0; margin-bottom: 20px; }
        .file-item {
            list-style: none;
            padding: 12px 20px;
            border-bottom: 1px solid #30363d;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }
        .file-item:last-child { border-bottom: none; }
        .file-item:hover { background: #1f242c; color: #58a6ff; }
        .file-info { font-size: 0.85em; color: #8b949e; }

        /* Секция плеера (скрыта по умолчанию) */
        .video-container {
            display: none;
            margin-top: 20px;
            background: #161b22;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #30363d;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        #my-video { width: 100%; border-radius: 6px; overflow: hidden; background: #000; }

        .video-title { margin-top: 0; font-size: 1.1em; color: #f0f6fc; }

        .btn-download {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 18px;
            background: #238636;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.9em;
            font-weight: 600;
        }
        .btn-download:hover { background: #2ea043; }
    </style>
</head>
<body>

<div class="container">
    <h1>📁 Мои файлы в My-git</h1>

    <ul id="file-list" class="file-list">Загрузка списка файлов...</ul>

    <div id="player-section" class="video-container">
        <h3 id="current-title" class="video-title"></h3>
        <video id="my-video" class="video-js vjs-big-play-centered" controls preload="auto" data-setup='{}'>
            <source id="video-source" src="" type="video/mp4">
        </video>
        <center>
            <a id="download-link" class="btn-download" href="#" target="_blank">📥 Скачать / Открыть в плеере</a>
        </center>
    </div>
</div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script>
    const user = 'Romanfoks';
    const repo = 'My-git';
    let player;

    // Инициализируем плеер при загрузке
    document.addEventListener('DOMContentLoaded', () => {
        player = videojs('my-video');
        loadFiles();
    });

    async function loadFiles() {
        try {
            const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/`);
            const data = await res.json();
            const list = document.getElementById('file-list');
            list.innerHTML = '';

            data.forEach(file => {
                if (file.name === 'index.html' || file.name === '.gitattributes') return;

                const isVideo = file.name.match(/\.(mkv|mp4|webm)$/i);
                const icon = isVideo ? '🎬' : '📄';

                const li = document.createElement('li');
                li.className = 'file-item';
                li.innerHTML = `
                        <span>${icon} ${file.name}</span>
                        <span class="file-info">${(file.size / 1024 / 1024).toFixed(1)} MB</span>
                    `;

                li.onclick = () => {
                    if (isVideo) {
                        playVideo(file);
                    } else {
                        window.open(file.html_url, '_blank');
                    }
                };
                list.appendChild(li);
            });
        } catch (e) {
            document.getElementById('file-list').innerText = 'Ошибка загрузки файлов :(';
        }
    }

    function playVideo(file) {
        const section = document.getElementById('player-section');
        const rawUrl = `https://raw.githubusercontent.com/${user}/${repo}/main/${encodeURIComponent(file.path)}`;

        // Показываем блок с плеером
        section.style.display = 'block';
        document.getElementById('current-title').innerText = "Сейчас играет: " + file.name;
        document.getElementById('download-link').href = rawUrl;

        // Загружаем видео в плеер
        player.src({ type: 'video/mp4', src: rawUrl });
        player.load();

        // Скроллим к плееру
        section.scrollIntoView({ behavior: 'smooth' });
        player.play();
    }
</script>
</body>
</html>
