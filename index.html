<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My-git YouTube Style</title>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link href="https://unpkg.com/@videojs/themes@1.0.1/dist/city/index.css" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', Arial, sans-serif; background: #0f0f0f; color: #f1f1f1; padding: 20px; margin: 0; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { font-size: 24px; font-weight: 500; border-bottom: 1px solid #3f3f3f; padding-bottom: 15px; }

        /* File List */
        .file-list { background: #0f0f0f; border-radius: 12px; padding: 0; margin-top: 20px; }
        .file-item {
            list-style: none; padding: 10px 15px; border-radius: 8px;
            cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.1s;
        }
        .file-item:hover { background: #272727; }
        .file-name { display: flex; align-items: center; gap: 15px; font-size: 16px; }
        .file-info { font-size: 12px; color: #aaaaaa; }

        /* Video Section */
        .video-section { display: none; margin-bottom: 30px; position: relative; }
        .video-js {
            width: 100% !important; height: auto !important; aspect-ratio: 16/9;
            border-radius: 12px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.9);
        }

        /* YouTube-like Volume & Controls */
        .vjs-youtube-theme .vjs-big-play-button { background-color: rgba(0,0,0,0.6); border: none; }
        .video-js .vjs-load-progress { background: rgba(255,255,255,0.3); }
        .video-js .vjs-play-progress { background: #ff0000; } /* Красная полоска YT */
        .video-js .vjs-slider { background: rgba(255,255,255,0.2); }

        .video-header { display: flex; justify-content: space-between; align-items: flex-start; padding: 10px 0; }
        .video-title { font-size: 18px; margin: 0; font-weight: 500; color: #fff; }

        .close-player {
            background: none; border: none; color: #aaa; font-size: 24px;
            cursor: pointer; padding: 0 10px; transition: 0.2s;
        }
        .close-player:hover { color: #fff; transform: scale(1.2); }

        .actions { margin-top: 10px; display: flex; gap: 10px; }
        .btn-yt {
            background: #272727; color: white; padding: 8px 16px; border-radius: 18px;
            text-decoration: none; font-size: 14px; font-weight: 500; transition: 0.2s;
        }
        .btn-yt:hover { background: #3f3f3f; }
    </style>
</head>
<body>

<div class="container">
    <div id="player-ui" class="video-section">
        <div class="video-header">
            <h3 id="current-title" class="video-title"></h3>
            <button class="close-player" onclick="closePlayer()" title="Close">×</button>
        </div>

        <video id="my-video" class="video-js vjs-theme-city vjs-big-play-centered" controls preload="auto"></video>

        <div class="actions">
            <a id="download-link" class="btn-yt" href="#" target="_blank">Download</a>
        </div>
    </div>

    <h1>Files</h1>
    <ul id="file-list" class="file-list">Loading repository...</ul>
</div>

<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script>
    const user = 'Romanfoks';
    const repo = 'My-git';
    let player;

    document.addEventListener('DOMContentLoaded', () => {
        player = videojs('my-video', {
            playbackRates: [0.5, 1, 1.5, 2],
            userActions: { hotkeys: true },
            controlBar: {
                children: [
                    'playToggle',
                    'volumePanel',
                    'currentTimeDisplay',
                    'progressControl',
                    'durationDisplay',
                    'playbackRateMenuButton',
                    'fullscreenToggle',
                ],
                volumePanel: { inline: true } // Выезжающая громкость как на YT
            }
        });
        loadFiles();
    });

    async function loadFiles() {
        const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/`);
        const data = await res.json();
        const list = document.getElementById('file-list');
        list.innerHTML = '';

        data.forEach(file => {
            // Игнорируем ненужное
            if (file.name === 'index.html' || file.name === '.gitattributes' || file.name === '.idea') return;

            const isVideo = file.name.match(/\.(mkv|mp4|webm)$/i);
            const li = document.createElement('li');
            li.className = 'file-item';
            li.innerHTML = `
                <div class="file-name">
                    <span>${isVideo ? '▶️' : '📄'}</span>
                    <span>${file.name}</span>
                </div>
                <span class="file-info">${(file.size / (1024*1024)).toFixed(1)} MB</span>
            `;

            li.onclick = () => isVideo ? playVideo(file) : window.open(file.html_url, '_blank');
            list.appendChild(li);
        });
    }

    function playVideo(file) {
        const ui = document.getElementById('player-ui');
        const rawUrl = `https://raw.githubusercontent.com/${user}/${repo}/main/${encodeURIComponent(file.path)}`;

        ui.style.display = 'block';
        document.getElementById('current-title').innerText = file.name;
        document.getElementById('download-link').href = rawUrl;

        player.src({ type: 'video/mp4', src: rawUrl });
        player.play();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function closePlayer() {
        player.pause();
        player.src('');
        document.getElementById('player-ui').style.display = 'none';
    }
</script>

</body>
</html>
